<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parkavi & Vignesh Engagement Invitation</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f4f4f4;
        }
        .invitation-card {
            position: relative;
            display: inline-block;
            width: 100%;
            max-width: 600px;
        }
        .invitation-card img {
            width: 100%;
            height: auto;
            display: block;
        }
        .svg-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

    <div class="invitation-card">
        <img src="Invitation.jpg.jpeg" alt="Engagement Invitation">
        
        <!-- SVG coordinates match the original image resolution and scale automatically -->
        <svg class="svg-overlay" viewBox="0 0 3000 2400" preserveAspectRatio="xMidYMid meet">
            <a href="https://maps.app.goo.gl/9anNHNfCJ6iMsRZG9" target="_blank" title="Thangam Mahal">
                <circle cx="1528" cy="2177" r="241" fill="transparent" />
            </a>
        </svg>
    </div>

</body>
</html>
