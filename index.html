<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parkavi & Vignesh Engagement Ceremony</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f4f4f4;
        }
        .container {
            position: relative;
            width: 100%;
            max-width: 600px;
        }
        img {
            width: 100%;
            height: auto;
            display: block;
        }
        .location-link {
            position: absolute;
            bottom: 1.5%;
            left: 10%;
            width: 80%;
            height: 7%;
            display: block;
            z-index: 10;
        }

        /* Styling specifically for printing to PDF */
        @media print {
            body {
                background-color: #fff;
            }
            .container {
                max-width: 100%;
            }
            @page {
                margin: 0;
                size: auto;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <img src="Invitation.png" alt="Engagement Invitation">
        <a href="https://maps.app.goo.gl/kFBSm6T3jAxyxvsU7" target="_blank" class="location-link" title="Click Here to View Location"></a>
    </div>

</body>
</html>
