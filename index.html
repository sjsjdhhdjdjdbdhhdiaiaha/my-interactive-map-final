<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parkavi & Vignesh Engagement Invitation</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f4f4f4;
        }
        .invitation-card {
            position: relative;
            display: inline-block;
            max-width: 100%;
        }
        .invitation-card img {
            width: 100%;
            max-width: 600px; /* Constrains card size for neat display */
            height: auto;
            display: block;
        }
        /* Clickable area positioned precisely over "Click Here to View Location" */
        .location-btn {
            position: absolute;
            bottom: 1.5%;
            left: 10%;
            width: 80%;
            height: 7%;
            display: block;
            cursor: pointer;
            z-index: 10;
        }
    </style>
</head>
<body>

    <div class="invitation-card">
        <img src="Invitation.png" alt="Engagement Invitation">
        <a href="https://maps.app.goo.gl/kFBSm6T3jAxyxvsU7" target="_blank" class="location-btn" title="Click Here to View Location"></a>
    </div>

</body>
</html>
